<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home | Francisco de Paula</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="preload" href="/src/styles/app.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="/src/styles/app.css"></noscript>
</head>
<body data-page="home">
  <div class="page">
    <header>
      <nav class="topbar" aria-label="Navegação principal">
        <div class="container topbar-inner">
          <a href="/public/index.html" class="topbar-logo" aria-label="Página inicial">fp</a>
          <div class="topbar-links">
            <a href="/public/index.html" class="topbar-link">Início</a>
            <a href="/src/pages/sobre/index.html" class="topbar-link">Sobre</a>
            <a href="/src/pages/contato/index.html" class="topbar-link">Contato</a>
            <button id="theme-toggle" class="theme-btn button button-ghost" type="button" aria-label="Alternar tema">
              <span class="icon-sun" aria-hidden="true">☀</span>
              <span class="icon-moon" aria-hidden="true">☾</span>
            </button>
          </div>
        </div>
      </nav>
    </header>

    <main class="container">
      <section class="hero">
        <h1 class="hero-name">Francisco de Paula</h1>
        <p class="hero-sub">Programador Full Stack focado no ecossistema .NET e especializado em ERP.</p>
      </section>

      <section class="content-section" aria-labelledby="projects-title">
        <div class="section-header">
          <h2 id="projects-title" class="section-title">Projetos</h2>
          <div class="section-divider" aria-hidden="true"></div>
        </div>

        <h3 class="sub-label">Destaques</h3>
        <ul id="projects-featured" class="item-list"><li class="item-empty">Carregando...</li></ul>

        <h3 class="sub-label">Últimos</h3>
        <ul id="projects-all" class="item-list"><li class="item-empty">Carregando...</li></ul>
      </section>

      <section class="content-section" aria-labelledby="experience-title">
        <div class="section-header">
          <h2 id="experience-title" class="section-title">Experiência</h2>
          <div class="section-divider" aria-hidden="true"></div>
        </div>
        <ul id="experience-list" class="item-list"><li class="item-empty">Carregando...</li></ul>
      </section>

      <section class="content-section" aria-labelledby="education-title">
        <div class="section-header">
          <h2 id="education-title" class="section-title">Educação</h2>
          <div class="section-divider" aria-hidden="true"></div>
        </div>
        <ul id="education-list" class="item-list"><li class="item-empty">Carregando...</li></ul>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <span class="footer-copy"><span class="copyleft">©</span> <span id="footer-year"></span> Francisco de Paula</span>
        <div class="footer-links">
          <a href="https://github.com/euchico" class="footer-link" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="https://www.linkedin.com/in/euchico" class="footer-link" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="/franciscodepaula-curriculo.pdf" class="footer-link" target="_blank" rel="noopener noreferrer">Currículo</a>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
